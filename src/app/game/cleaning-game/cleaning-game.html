<div class="game-container">

    <header class="game-header">
        <div>
            <h1>Cleaning Simulator</h1>
            <span>Mission : Nettoyer la cour</span>
        </div>

        <div class="progress-info">
            <strong>{{ progress.toFixed(0) }} %</strong>
            <span>Surface nettoyée</span>
        </div>
    </header>

    <div class="progress-track">
        <div class="progress-fill" [style.width.%]="progress">
        </div>
    </div>

    <div class="game-area">

        <canvas #gameCanvas class="game-canvas" (pointerdown)="onPointerDown($event)"
            (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp()" (pointercancel)="onPointerUp()"
            (pointerenter)="onPointerEnter($event)" (pointerleave)="onPointerLeave()">
        </canvas>

        <div class="dirt-types">

            @for (dirt of dirtTypes; track dirt.id) {
            <div class="dirt-type">
                <span class="color-preview" [style.background]="dirt.color">
                </span>

                <strong>{{ dirt.name }}</strong>

                <small>Résistance : {{ dirt.resistance }}</small>
            </div>
            }

        </div>

    </div>

    <footer class="game-footer">

        <div class="tool-info">
            <span class="tool-icon">🧽</span>
            <div>
                <strong>{{ activeTool.name }}</strong>
                <small>Rayon : {{ activeTool.radius }} px</small>
            </div>
        </div>

        <button (click)="resetGame()">
            Recommencer
        </button>

    </footer>

</div>
